name: Pecatho regression contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  critical-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify critical modules
        run: node scripts/verify-regression-contract.mjs
