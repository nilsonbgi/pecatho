name: Pecatho regression contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  critical-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify critical source contract
        run: node scripts/verify-regression-contract.mjs

  browser-regression:
    runs-on: ubuntu-24.04
    needs: critical-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require authenticated E2E test credentials
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in E2E_TEST_EMAIL E2E_TEST_PASSWORD E2E_CREATOR_PASSWORD E2E_ADMIN_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Authenticated regression tests must not be silently skipped. Configure the required authenticated E2E credentials in repository settings."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Diagnose npm vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const report = require("./npm-audit.json");
            if (report.error) {
              console.log("npm audit could not complete:", report.error.code || "", report.error.summary || report.error.message || "");
              process.exit(0);
            }
            const vulnerabilities = Object.entries(report.vulnerabilities || {});
            console.log("npm audit totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));
            const relevant = vulnerabilities.filter(([, item]) => ["high", "critical"].includes(item.severity));
            if (!relevant.length) console.log("No high/critical package vulnerabilities reported.");
            for (const [name, item] of relevant) {
              console.log("\nPACKAGE:", name, "| severity:", item.severity, "| installed range:", item.range, "| direct:", item.isDirect, "| fix:", JSON.stringify(item.fixAvailable));
              for (const advisory of item.via || []) {
                if (typeof advisory === "string") console.log("  dependency:", advisory);
                else console.log("  advisory:", advisory.title, "| range:", advisory.range, "| url:", advisory.url);
              }
            }
          '
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pecatho-npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
      - name: Enforce production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_CREATOR_EMAIL: social@pecatho.com
          E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
          E2E_ADMIN_EMAIL: nilson.umasno@gmail.com
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pecatho-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pecatho-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
